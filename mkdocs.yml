site_name: hydrofabric-builds
site_description: Building Hydrofabric(s) and processing ancillary data
repo_url: https://github.com/noaa-owp/hydrofabric-builds
repo_name: NOAA-OWP/hydrofabric-builds
theme:
  name: material
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.suggest
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home:
    - index.md
    - Quickstart: quickstart.md
  - Hydrofabric:
    - builds/index.md
    - Build Process: builds/build_process.md
    - Divide Attributes: builds/divide_attributes.md
    - Flowpath Attributes: builds/flowpath_attributes.md
    - Lakes: builds/lakes.md
    - Reservoir Attributes: builds/reservoir_attrs.md
    - Gage Snapping: builds/snap_gages_to_flowpaths.md
    - Gages: builds/gages.md
    - OCONUS: builds/oconus.md
  - Development:
    - development/index.md
    - Development: development/development.md
    - Architecture: development/architecture.md
    - Configuration: development/configuration.md
    - Tools: development/tools.md
