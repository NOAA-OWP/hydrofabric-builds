gages:
  gages:
    inputs:
      usgs_discontinued:
        dir: usgs_gages_discontinued
        gage_source_crs: EPSG:4326
        id_col_name: site_no
      usgs_active:
        dir: usgs_active_gages
        id_col_name: site_no
      txdot_gages:
        path: TXDOT_gages/TXDOT_gages.txt
        gage_source_crs: EPSG:4326
        id_col_name: site_no
      other:
        path: other/gage_xy_v1.1.csv
        gage_source_crs: EPSG:4326
        id_col_name: site_no
        x_col_name: lon
        y_col_name: lat
      CIROH_UA:
        path: CIROH_UA/gage_area.csv
        id_col_name: gage
        area_col_name: area_sqkm
      nwm_calib_gages:
        path: nwm_calib/nwm_calib_gages_07112025.csv
        gage_source_crs: EPSG:4326
        id_col_name: site_no
      routelink:
        path: routelink/RouteLink_CONUS_EPSG4326.gpkg
        gage_source_crs: EPSG:4326
        id_col_name: gages
      rfc:
        path: rfc/nwps_all_gauges_report.csv
        id_col_name: nws shef id
        status_col_name: forecast status
        x_col_name: longitude
        y_col_name: latitude
        gage_source_crs: EPSG:4326
      nwm_rfc:
        path: rfc/reservoir_index_AnA.nc
        rfc_id_col: 'rfc_gage_id'
        usace_id_col: 'usace_gage_id'
      usbr:
        path: other/usbr.gpkg
        id_col_name: 'locId'
      usace:
        path: other/usace_crosswalk.gpkg
        id_col_name: location
      canada_great_lakes: True
    target:
      crs: EPSG:5070
      snap_tolerance_m: 100.0
      update_existing: True
      exclude_ids: ["15056210", "15493000"]
      out_gpkg: gages/gages_v1.1.gpkg
      gpkg_layer_name: gages_v1.1

  ###--------------------------------------------
  ## A file for USGS upstream area and basins shapefiles
  ###--------------------------------------------
  NLDI_upstream_basins:
    run_NLDI_upstream_basins: False
    path: nldi_upstream_basins.gpkg
    layer_polys: NLDI_upstream_basins
    layer_points: "sites"

  ###--------------------------------------------
  ## SNAPPING FLOWPATHS TO GAGES based on upstream catchments area
  ###--------------------------------------------
  assign_fp_to_gages:
   rel_err: 0.25                    # relative acceptable error between total upstream area and USGS upstream area.
   buffer_m: 7000.0                # Buffering around point gages to find flowpaths. in meters
   parallel: False                  # serial (False) or parallel (True)
   max_workers: null                  # None: if serial
   USGS_NLDI_crs: EPSG:4326      # usgs crs used in NLDI API. more info: https://waterdata.usgs.gov/blog/nldi-intro/
   work_crs: EPSG:5070           # an area-equal crs to calculate buffers and distances
   override_fp_path: other/override_gage_flowpaths.csv # override fp/vfp for gage with values in table
# --------------------------------------------------
# flowpath crosswalk (fp_crosswalk)
# --------------------------------------------------
fp_crosswalk:
  # reference (file1) – usually hydrofabric reference flowpaths
  reference:
    id_col: flowpath_id                     # id1_col in code

  # target network (file2) – e.g., NWM or NHDPlus
  target:
    path: data/reference/nwm_flows.gpkg               # <- file2
    layer: nwm_streams                     # layer2 in code
    id_col: ID                             # id2_col in code

  # geometric / matching parameters
  search_radius_m: 10.0       # buffer radius around each reference flowline
  percent_inside_min: 0.005    # min pct of matched path inside band for single-candidate shortcut

  outputs:
    # final full-table crosswalk output
    path: data/nhd-crosswalk/nhd_crosswalk.parquet

# --------------------------------------------------
# validate hydrofabric
# --------------------------------------------------
validate_hf:
  calibration_gages_path: data/gages/validation/calibratable_gages.csv
  routelink_gages_path: data/gages/routelink/RouteLink_CONUS_EPSG4326.gpkg

#---------------------------------------------------
# lakes
#---------------------------------------------------
lakes:
  input_dir: "./data/sconus/lakes/"
  vfp_lake_crosswalk: True
  calculate_elevation: True
  use_cached_lakes: False
  output_comid_field: "lake_id"
  lakes_path: "output/sconus_lakes.gpkg"
  validate_duplicates: True # flag to search for duplicate lake points during lakes validation. Defaults to true
  save_duplicate_gpkgs: False # flag to (in addition to normal output) save the resulting duplicate lake points/polygons as geopackages. Defaults to false
  nwm:
    run: True
    associate_flowpaths: True # this will run the flowpath association
    improve_placement_ref_res: True # this takes 20-30 minutes. Turn off for speed or if placement not important
    improve_placement_path: "output/nwm_lakes_improved_placement.gpkg"
    use_cached_improve_placement: False # change to true to skip if you have already built
    path: "input/nwm_lakes_sconus_input.gpkg"
    buffered_path: "input/nwm_lakes_sconus_input_500m_buffer.gpkg" # source path, with polygons buffered out (for validating duplicate lake points). LakesConfig will inject preceding input path.
    layer: "nwm_lakes"
    fp_associated_path: "output/sconus_lakes_fp_associated.gpkg" # can be empty or populated
    flowpath_association_method: "polygon_outlet" # "nearest_point" or "polygon_outlet"
    id_field: "newID"
    output_id_field: "lake_id"
    search_radius_m: 25000.0
    intersection_length_min_m: 3.0
    attrib_src_path: "input/nwm_patch_conus_nextgen.gpkg" # file to get attributes from
    attrib_src_layer: "lakes"
    attrib_src_key: "lake_id"
    max_refres_search_distance_m: 500.0
  adhoc:
    run: True
    path: "input/adhoc_lakes.gpkg"
    layer: "adhoc_lakes"
    ref_wb_field: ref_waterbodies_only
  usbr:
    run: True
    path: input/usbr_lake_crosswalk.gpkg
    id_field: locId
    lake_id_field: lake_id
  ref_res:
    run: True
    path: input/reference-reservoirs-v1.gpkg
    layer: reference-reservoirs-v1
    src_crs: null
    output_crs: EPSG:5070
    distance_to_fp_col: distance_to_fp_m
    wb_area_col: wb_areasqkm
    ref_wb_id_col: ref_fab_wb
    min_wb_area_sqkm: 0.2
    max_distance_m: 1000.0
  ref_wb:
    run: True
    path: input/reference_waterbodies.gpkg
    layer: reference_waterbodies
    src_crs: null
    output_crs: EPSG:5070
    id_field: comid
    flowpath_association_method: "polygon_outlet"
    search_radius_m: 25000.0
    intersection_length_min_m: 3.0
  nid:
    path: input/NID2019_U.csv
  dem:
    path: input/COP90_DEM_SuperCONUS.tif
    nodata: -99999
  great_lakes:
    superior:
      lake_id: "4800002"
      fp_id: 1278348162056612
      virtual_fp_id: 1278346877373953
      site_no: "04127885"
    mi_huron:
      lake_id: "4800004"
      fp_id: 1276364270499315
      virtual_fp_id: 1276364270423160
      site_no: "04159130"
    erie:
      lake_id: "4800006"
      fp_id: 1286192735893685
      virtual_fp_id: 1286154743979494
      site_no: "02HA013"
    ontario:
      lake_id: "4800007"
      fp_id: 1287248237297035
      virtual_fp_id: 1287248166320950
      site_no: "IJC"

res_da:
  input_dir: "./data/sconus/lakes/"
  lake_id_field: "lake_id"
  gage_id_field: "site_no"
  da_type_field: "da_type"
  great_lakes: True
  generate_additional_crosswalk: False
  all_level_pool: False
  adhoc:
    run: True
    path: "input/adhoc_lakes.gpkg"
    layer: "adhoc_lakes"
    rfc_field: "locationId"
    lake_id_field: "lake_id"
    null_value: -99999
  res_crosswalk:
    path: "input/reservoir_index_AnA.nc"
  active_rfc:
    path: input/nwps_all_gauges_report.csv
    id_field: nws shef id
  usace:
    run: True
    path: input/usace_crosswalk.gpkg
    id_field: location
    lake_id_field: lake_id
  usbr:
    run: True
    path: input/usbr_lake_crosswalk.gpkg
    id_field: locId
    lake_id_field: lake_id
  usgs_fix_list: ['137462010', '208250410', '21556525']
